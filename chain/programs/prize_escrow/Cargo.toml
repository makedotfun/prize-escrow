[package]
name = "prize_escrow"
version = "0.1.0"
description = "make.fun prize escrow: a funded vault per competition, a bonded and challengeable result, k-of-n regrader attestations, a Squads arbiter, and merkle self-claims"
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "prize_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# anchor-spl 1.2.1's idl_build.rs implements IdlBuild for token_interface::{Mint, TokenAccount}
# without gating them on token_2022, so its idl-build feature does not compile without it. The
# feature only reaches the host-side IDL build (`anchor build` runs it as a test); the SBF program
# never enables idl-build, so the deployed program still carries no Token-2022 code.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Lowers MIN_CHALLENGE_WINDOW, MIN_ATTEST_WINDOW and MIN_HOLD_WINDOW to 60 s and MIN_CLAIM_WINDOW
# to 90 s. Only the localnet and devnet build (chain/target/deploy-test-windows,
# scripts/chain/build.ts) turns it on; the release build (`anchor build --arch v2`,
# chain/target/deploy) never does. Both are SBPF v2, the version the clusters run
# (scripts/chain/build.ts CANONICAL_SBF_ARCH).
test-windows = []

[dependencies]
# event-cpi: every instruction emits its event with emit_cpi!, a self-CPI the runtime records in
# the transaction's inner instructions, where a log truncated by a CPI caller cannot hide it.
anchor-lang = { version = "1.2.1", features = ["init-if-needed", "event-cpi"] }
# Classic SPL Token and the associated-token program only: no token_2022 (a transfer-hook or
# fee-bearing mint cannot reach the vault). solana-v3 is anchor-spl's default Solana 3.x cohort,
# restated because default features are off.
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "associated_token", "solana-v3"] }
# keccak256 for the merkle leaves and pairs: the sol_keccak256 syscall on chain; the sha3 feature
# only supplies the host implementation for `cargo test`.
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
# sha256 for the result commitment (state::result_commitment): the sol_sha256 syscall on chain;
# the sha2 feature only supplies the host implementation for `cargo test`. Already in the graph
# (anchor's and LiteSVM's dependencies use the same 3.1.0).
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
# security.txt (lib.rs): where a researcher reports a vulnerability, embedded in the program's
# bytes and read by explorers. Verified 2026-10-27.
solana-security-txt = "=1.1.3"

[dev-dependencies]
# LiteSVM 0.18.1 runs Agave 4.3's runtime, the release mainnet runs: its own crates know every
# feature mainnet has active (0.15's Agave 4.1 did not know nine of them, among them SIMD-0392's
# relaxed post-execution balance check and SIMD-0385's v1 transactions) and it derives the Rent
# sysvar from the SIMD-0437 gates. Agave 4.3's crates need Rust 1.97.1 (chain/rust-toolchain.toml);
# the SBF build's platform-tools compiler is unaffected. The tests never use LiteSVM::new(): every
# LiteSVM starts from the feature set pinned from mainnet (tests/mainnet/mod.rs, from
# scripts/chain/feature-set.ts). The tests load the canonical SBPF v2 release build, the bytes
# mainnet deploys.
litesvm = "0.18.1"
# The FeatureSet LiteSVM takes and the runtime's feature list (tests/feature_set.rs): the
# agave-feature-set LiteSVM's graph already pins.
agave-feature-set = { version = "4.3", features = ["agave-unstable-api"] }
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
# The types LiteSVM's set_account and transaction results use (versions pinned by LiteSVM's graph),
# and serde_json to read the committed IDL and the pinned feature set.
solana-account = "4"
solana-transaction-error = "3"
serde_json = "1"
# The property tests (tests/properties.rs) and the blast-radius oracle's sequences
# (tests/blast_radius.rs): Apache-2.0 OR MIT. No fork or timeout features (each case runs in
# process).
proptest = { version = "1.12", default-features = false, features = ["std"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
